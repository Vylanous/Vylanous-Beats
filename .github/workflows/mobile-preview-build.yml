name: Build Android preview APK

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Reason for this preview build"
        required: true
        default: "Vylanous Beats visual system refresh"

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate and request Android preview APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check mobile app
        run: bunx tsc --noEmit
      - name: Request Android preview APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          bunx eas-cli build
          --platform android
          --profile preview
          --non-interactive
          --no-wait
