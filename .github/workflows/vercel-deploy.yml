name: Deploy web to Vercel

on:
  push:
    branches: [main]
    paths:
      - "packages/web/**"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/vercel-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Validate and deploy web
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check required deployment secrets
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is missing"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "VERCEL_ORG_ID is missing"; exit 1; }
          test "$VERCEL_PROJECT_ID" = "prj_EHMEyY9jzAh8Q2mo73FaCwPiCi0j" || {
            echo "VERCEL_PROJECT_ID does not match the configured Vylanous Beats project"
            exit 1
          }

      - name: Type-check web app
        run: bun --cwd packages/web run typecheck

      - name: Build web app
        run: bun --cwd packages/web run build

      - name: Link Vercel project for this run
        working-directory: packages/web
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull Vercel production settings
        working-directory: packages/web
        run: bunx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build Vercel production artifact
        working-directory: packages/web
        run: bunx vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt artifact to production
        working-directory: packages/web
        run: bunx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"

      - name: Remove temporary Vercel project link
        if: always()
        working-directory: packages/web
        run: rm -rf .vercel
