name: Deploy web to Render

on:
  push:
    branches: [main]
    paths:
      - "packages/web/**"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/render-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Validate and deploy web
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check reachable dependency advisories
        run: bun run audit:reachable

      - name: Type-check web app
        run: bun --cwd packages/web run typecheck

      - name: Lint web app
        run: bun --cwd packages/web run lint

      - name: Test web app
        run: bun --cwd packages/web run test

      - name: Build web app
        run: bun --cwd packages/web run build

      - name: Trigger Render production deploy
        if: github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL" || {
            echo "RENDER_DEPLOY_HOOK_URL is missing"
            exit 1
          }
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error --location --output "$response_file" --write-out '%{http_code}' --request POST "$RENDER_DEPLOY_HOOK_URL")"
          cat "$response_file"
          rm -f "$response_file"
          case "$http_code" in
            200|202) echo "Render accepted the production deploy request (HTTP $http_code)." ;;
            *) echo "Render rejected the deploy request (HTTP $http_code)."; exit 1 ;;
          esac
