name: Publish mobile update

on:
  push:
    branches: [main]
    paths:
      - "packages/mobile/**"
      - "bun.lock"
      - ".github/workflows/mobile-update.yml"
  workflow_dispatch:
    inputs:
      message:
        description: "Customer-facing update message"
        required: true
        default: "Latest Vylanous Beats mobile experience"

permissions:
  contents: read

jobs:
  validate-and-publish:
    name: Validate and publish Expo update
    runs-on: ubuntu-latest
    if: ${{ secrets.EXPO_TOKEN != '' }}
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check mobile app
        run: bunx tsc --noEmit
      - name: Publish production update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          bunx eas-cli update
          --branch production
          --message "${{ inputs.message || github.event.head_commit.message }}"
          --non-interactive
