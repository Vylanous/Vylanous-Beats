name: Publish mobile update

on:
  push:
    branches: [main]
    paths:
      - "packages/mobile/**"
      - "bun.lock"
      - ".github/workflows/mobile-update.yml"
  workflow_dispatch:
    inputs:
      message:
        description: "Customer-facing update message"
        required: true
        default: "Latest Vylanous Beats mobile experience"
      channel:
        description: "Update channel (manual releases default to preview)"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  validate:
    name: Validate mobile release readiness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check mobile app
        run: bunx tsc --noEmit
      - name: Validate Expo configuration
        run: bunx expo config --type public > /dev/null
      - name: Verify Expo publishing credential
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=EXPO_TOKEN is required::Add an Expo access token with update publishing access in GitHub Actions secrets before publishing an OTA update. Validation completed, but no update was published."
            exit 1
          fi

  publish:
    name: Publish Expo update
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Publish production update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          UPDATE_CHANNEL: ${{ inputs.channel || 'production' }}
          UPDATE_MESSAGE: ${{ inputs.message || github.event.head_commit.message }}
        run: |
          bunx eas-cli update \
            --branch "$UPDATE_CHANNEL" \
            --message "$UPDATE_MESSAGE" \
            --non-interactive
